<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mighty Party Config Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
        .search-container {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            word-break: break-all;
        }
        .meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            word-break: break-all;
        }
        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            align-self: flex-start;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%; max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { margin: 0; font-size: 1.2rem; }
        .close-btn {
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
        }
        .close-btn:hover { color: var(--text-primary); background: transparent; }
        pre {
            margin: 0;
            padding: 16px;
            overflow: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9rem;
            color: #38bdf8;
            flex-grow: 1;
        }
    </style>
</head>

        const entries = Object.entries(configData);

        function renderCards(dataToRender) {
            const grid = document.getElementById('configGrid');
            if (!grid) return;
            grid.innerHTML = '';
            dataToRender.forEach(([name, info]) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <h3>${name}</h3>
                        <div class="meta"><strong>Hash:</strong> ${info.hash}<br><strong>URL:</strong> ${info.url}</div>
                    </div>
                    <button onclick="fetchLocalJson('${name}')">View Saved JSON</button>
                `;
                grid.appendChild(card);
            });
        }

        setTimeout(() => {
            const stats = document.getElementById('stats');
            if (stats) stats.innerText = `Total Endpoints: ${entries.length}`;
            renderCards(entries);
        }, 50);

        function filterConfigs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = entries.filter(([name, info]) => 
                name.toLowerCase().includes(query) || info.hash.toLowerCase().includes(query)
            );
            renderCards(filtered);
        }

        async function fetchLocalJson(name) {
            const modal = document.getElementById('jsonModal');
            const modalTitle = document.getElementById('modalTitle');
            const jsonOutput = document.getElementById('jsonOutput');

            modalTitle.innerText = `Config: ${name}`;
            jsonOutput.innerText = `Loading ./decoded_configs/${name}.json...`;
            modal.style.display = 'flex';

            try {
                const response = await fetch(`./decoded_configs/${name}.json`);
                if (!response.ok) throw new Error(`File decoded_configs/${name}.json not found in repository. Ensure your GitHub Action workflow has run and committed the decoded JSON files.`);
                
                const jsonData = await response.json();
                jsonOutput.innerText = JSON.stringify(jsonData, null, 2);
            } catch (error) {
                jsonOutput.innerText = `Error loading config JSON:\n${error.message}`;
            }
        }

        function closeModal() {
            document.getElementById('jsonModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('jsonModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
