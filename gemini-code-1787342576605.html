<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Guild War Map Generator - Turfwar Template</title>
<style>
    body { background-color: #1a1c1e; color: white; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .input-section { display: flex; gap: 20px; margin-bottom: 15px; width: 100%; max-width: 950px; }
    .input-box { flex: 1; }
    textarea { width: 100%; height: 110px; background: #23272a; color: #fff; border: 1px solid #7289da; padding: 10px; font-family: monospace; font-size: 13px; }
    .btn-group { margin-bottom: 20px; display: flex; gap: 10px; width: 100%; max-width: 950px; }
    button { background: #7289da; color: white; border: none; padding: 12px 24px; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 14px; }
    button:hover { background: #5b6eae; }
    .btn-download { background: #43b581; }
    .btn-download:hover { background: #35a371; }
    
    .war-board { display: inline-block; background: #23272a; padding: 20px; border-radius: 8px; border: 2px solid #b8860b; position: relative; margin-bottom: 20px; }
    .grid-layout { display: grid; grid-template-columns: 45px repeat(6, 130px) 45px; grid-template-rows: 45px repeat(5, 120px) 45px; gap: 4px; align-items: center; justify-items: center; }

    .cell { border: 2px solid #b8860b; width: 130px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; box-sizing: border-box; overflow: hidden; text-align: center; background-color: #4f545c; }
    .cell-power { font-size: 26px; margin-bottom: 4px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.9); white-space: normal; word-break: break-all; }
    
    .force-row { font-size: 21px; margin-top: 3px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; text-shadow: 1px 1px 2px rgba(0,0,0,0.9); }
    .force-color-square { width: 16px; height: 16px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.7); display: inline-block; flex-shrink: 0; }
    .force-power { font-weight: bold; }
    
    .winning-enemy { text-decoration: underline; }

    .perimeter-stack { display: flex; flex-direction: row; gap: 2px; width: 130px; height: 40px; align-items: center; justify-content: center; flex-wrap: wrap; overflow: hidden; }
    .side-stack { display: flex; flex-direction: column; gap: 2px; width: 40px; height: 120px; align-items: center; justify-content: center; flex-wrap: wrap; overflow: hidden; }
    
    .guild-tag-box-h { width: 22px; height: 12px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.7); box-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
    .guild-tag-box-v { width: 12px; height: 22px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.7); box-shadow: 1px 1px 2px rgba(0,0,0,0.7); }

    .color-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #fff; flex-shrink: 0; }

    .legend-box { background: #23272a; padding: 20px; border-radius: 8px; border: 1px solid #7289da; width: 100%; max-width: 850px; box-sizing: border-box; }
    .legend-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; justify-items: center; }
    .legend-col { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 250px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
</style>
</head>
<body>

<h1>Guild War Map Generator (Precise Template Mapping)</h1>
<div class="input-section">
    <div class="input-box">
        <label><b>1. Get Room Guilds JSON (for guild order &amp; entrances):</b></label>
        <textarea id="roomInput" placeholder="Paste get room guilds JSON here..."></textarea>
    </div>
    <div class="input-box">
        <label><b>2. Get Map JSON (for internal cell data &amp; forces):</b></label>
        <textarea id="mapInput" placeholder="Paste get map JSON here..."></textarea>
    </div>
</div>

<div class="btn-group">
    <button onclick="generateMap()">Generate Map</button>
    <button class="btn-download" onclick="downloadPage()">Download HTML File</button>
</div>

<div class="war-board" id="warBoard">
    <div class="grid-layout" id="gridLayout"></div>
</div>

<div class="legend-box" id="statusLegendBox">
    <div class="legend-columns">
        <div class="legend-col" id="statusCol1"></div>
        <div class="legend-col" id="statusCol2"></div>
        <div class="legend-col" id="statusCol3"></div>
    </div>
</div>

<script>
const fixedGuildColors = {
    1: "#76ecd0", // Guild 1: Light Mint Green
    2: "#95edff", // Guild 2: Light Cyan / Sky Blue
    3: "#4a89ff", // Guild 3: Medium Blue
    4: "#b19ffb", // Guild 4: Lavender / Light Purple
    5: "#ff4d4d", // Guild 5: Bright Red
    6: "#ff9e3b", // Guild 6: Orange
    7: "#fef064", // Guild 7: Yellow
    8: "#ffffff", // Guild 8: White
    9: "#8a3b3b", // Guild 9: Maroon / Dark Red
    10: "#ffb3d9" // Guild 10: Pink
};

function getGuildColor(position) {
    const templateIndex = ((position - 1) % 10) + 1;
    return fixedGuildColors[templateIndex] || "#36393f";
}

const entranceTemplates = {
    1: ['a4', 'b1', 'b6', 'e2', 'e6'],
    2: ['a4', 'b1', 'b6', 'e2', 'e6'],
    3: ['a4', 'b6', 'd1', 'e3', 'e6'],
    4: ['a5', 'b1', 'c6', 'e1', 'e4'],
    5: ['a3', 'a6', 'c1', 'e2', 'e5'],
    6: ['a3', 'b1', 'd6', 'e2', 'e5'],
    7: ['a1', 'a4', 'c6', 'd1', 'e3'],
    8: ['a2', 'a6', 'c1', 'd6', 'e4'],
    9: ['a2', 'a5', 'b6', 'e1', 'e5'],
    10: ['a2', 'a5', 'c1', 'c6', 'e3']
};

function formatNumber(num) {
    if (isNaN(num) || num === null) return '???';
    let absNum = Math.abs(num);
    let sign = num < 0 ? '-' : '';
    let formatted = '';
    if (absNum >= 1e9) {
        formatted = (absNum / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
    } else if (absNum >= 1e6) {
        formatted = (absNum / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
    } else if (absNum >= 1e3) {
        formatted = (absNum / 1e3).toFixed(1).replace(/\.?0+$/, '') + 'k';
    } else {
        formatted = absNum.toString();
    }
    return sign + formatted;
}

function generateMap() {
    const roomVal = document.getElementById('roomInput').value;
    const mapVal = document.getElementById('mapInput').value;
    const gridLayout = document.getElementById('gridLayout');
    
    const statusCol1 = document.getElementById('statusCol1');
    const statusCol2 = document.getElementById('statusCol2');
    const statusCol3 = document.getElementById('statusCol3');
    
    gridLayout.innerHTML = '';
    statusCol1.innerHTML = '';
    statusCol2.innerHTML = '';
    statusCol3.innerHTML = '';

    let mapData = {};
    let roomData = {};

    try {
        if (mapVal.trim()) mapData = JSON.parse(mapVal);
    } catch (e) {
        alert('Invalid Map JSON: ' + e.message);
        return;
    }

    try {
        if (roomVal.trim()) roomData = JSON.parse(roomVal);
    } catch (e) {
        alert('Invalid Room Guilds JSON: ' + e.message);
        return;
    }

    const cells = mapData.result && mapData.result.cells ? mapData.result.cells : [];
    const dimX = 6;

    const cellMap = {};
    const holdingGuilds = new Set();
    cells.forEach(c => {
        cellMap[`${c.x},${c.y}`] = c;
        if (c.guild_name) {
            holdingGuilds.add(c.guild_name);
        }
    });

    const roomGuilds = [];
    const seenGuildNames = new Set();
    if (roomData.result && roomData.result.guilds) {
        roomData.result.guilds.forEach((g, idx) => {
            const gName = g.guild_name;
            if (gName && !seenGuildNames.has(gName)) {
                seenGuildNames.add(gName);
                const roomPlace = g.in_room_place || (roomGuilds.length + 1);
                const templateNum = ((roomPlace - 1) % 10) + 1;
                roomGuilds.push({
                    name: gName,
                    position: roomPlace,
                    entrances: entranceTemplates[templateNum] || []
                });
            }
        });
    }

    function getGuildColorByName(name) {
        if (name === 'Riot') return '#7f8c8d';
        let found = roomGuilds.find(rg => rg.name === name);
        if (found) {
            return getGuildColor(found.position);
        }
        return "#ffffff";
    }

    roomGuilds.forEach((g, index) => {
        const guildColor = getGuildColor(g.position);

        const statusItem = document.createElement('div');
        statusItem.className = 'legend-item';
        const sSwatch = document.createElement('div');
        sSwatch.className = 'color-swatch';
        sSwatch.style.backgroundColor = guildColor;
        statusItem.appendChild(sSwatch);
        
        const sLabel = document.createElement('span');
        sLabel.textContent = `${g.name} (#${g.position})` + (holdingGuilds.has(g.name) ? '' : ' (Off Map)');
        statusItem.appendChild(sLabel);

        if (index < 3) {
            statusCol1.appendChild(statusItem);
        } else if (index < 7) {
            statusCol2.appendChild(statusItem);
        } else {
            statusCol3.appendChild(statusItem);
        }
    });

    function getTopGuilds(colNumber) {
        const targetCoord = `a${colNumber}`;
        let matching = [];
        roomGuilds.forEach(g => {
            if (!holdingGuilds.has(g.name)) {
                g.entrances.forEach(ent => {
                    if (ent === targetCoord) {
                        if (!matching.includes(g)) matching.push(g);
                    }
                });
            }
        });
        return matching;
    }

    function getBottomGuilds(colNumber) {
        const targetCoord = `e${colNumber}`;
        let matching = [];
        roomGuilds.forEach(g => {
            if (!holdingGuilds.has(g.name)) {
                g.entrances.forEach(ent => {
                    if (ent === targetCoord) {
                        if (!matching.includes(g)) matching.push(g);
                    }
                });
            }
        });
        return matching;
    }

    function getLeftGuilds(rowLetter) {
        const targetCoord = `${rowLetter.toLowerCase()}1`;
        let matching = [];
        roomGuilds.forEach(g => {
            if (!holdingGuilds.has(g.name)) {
                g.entrances.forEach(ent => {
                    if (ent === targetCoord) {
                        if (!matching.includes(g)) matching.push(g);
                    }
                });
            }
        });
        return matching;
    }

    function getRightGuilds(rowLetter) {
        const targetCoord = `${rowLetter.toLowerCase()}6`;
        let matching = [];
        roomGuilds.forEach(g => {
            if (!holdingGuilds.has(g.name)) {
                g.entrances.forEach(ent => {
                    if (ent === targetCoord) {
                        if (!matching.includes(g)) matching.push(g);
                    }
                });
            }
        });
        return matching;
    }

    // --- 1. TOP PERIMETER ---
    gridLayout.appendChild(document.createElement('div'));
    for (let x = 0; x < dimX; x++) {
        const topStack = document.createElement('div');
        topStack.className = 'perimeter-stack';
        getTopGuilds(x + 1).forEach(g => {
            const tag = document.createElement('div');
            tag.className = 'guild-tag-box-h';
            tag.style.backgroundColor = getGuildColor(g.position);
            tag.title = g.name;
            topStack.appendChild(tag);
        });
        gridLayout.appendChild(topStack);
    }
    gridLayout.appendChild(document.createElement('div'));

    // --- 2. MIDDLE ROWS ---
    const boardRows = [
        { letter: 'A', jsonY: 4 },
        { letter: 'B', jsonY: 3 },
        { letter: 'C', jsonY: 2 },
        { letter: 'D', jsonY: 1 },
        { letter: 'E', jsonY: 0 }
    ];

    boardRows.forEach(row => {
        const leftStack = document.createElement('div');
        leftStack.className = 'side-stack';
        getLeftGuilds(row.letter).forEach(g => {
            const tag = document.createElement('div');
            tag.className = 'guild-tag-box-v';
            tag.style.backgroundColor = getGuildColor(g.position);
            tag.title = g.name;
            leftStack.appendChild(tag);
        });
        gridLayout.appendChild(leftStack);

        for (let x = 0; x < dimX; x++) {
            const cellDiv = document.createElement('div');
            cellDiv.className = 'cell';
            
            const cellData = cellMap[`${x},${row.jsonY}`];
            if (cellData) {
                let cellColor = '#36393f';
                roomGuilds.forEach(rg => {
                    if (rg.name === cellData.guild_name) {
                        cellColor = getGuildColor(rg.position);
                    }
                });
                cellDiv.style.backgroundColor = cellColor;
                
                let basePower = cellData.power;
                if (basePower === -1) {
                    basePower = 0;
                }

                let displayedPower = basePower;
                let filteredForces = [];

                if (cellData.forces) {
                    cellData.forces.forEach(f => {
                        const gName = (f.guild_id === -123456 || !f.guild_name) ? 'Riot' : f.guild_name;
                        let fPower = f.hidden ? 0 : f.power;
                        if (fPower === -1) fPower = 0;

                        if (cellData.guild_name && gName === cellData.guild_name) {
                            displayedPower += fPower;
                        } else {
                            filteredForces.push({ ...f, resolvedName: gName, resolvedPower: fPower });
                        }
                    });
                }

                // Determine highest attacker and net troop calculation
                let maxAttackerPower = -1;
                let topAttackerName = null;
                let topAttackerColor = '#ffffff';

                filteredForces.forEach(f => {
                    if (f.resolvedPower > maxAttackerPower) {
                        maxAttackerPower = f.resolvedPower;
                        topAttackerName = f.resolvedName;
                        topAttackerColor = getGuildColorByName(f.resolvedName);
                    }
                });

                let finalPowerVal = displayedPower;
                let netColor = '#ffffff';

                if (maxAttackerPower !== -1) {
                    finalPowerVal = displayedPower - maxAttackerPower;
                    if (finalPowerVal < 0) {
                        netColor = topAttackerColor;
                    }
                }

                let finalPowerText = (basePower === 0 && displayedPower === 0) ? '???' : formatNumber(finalPowerVal);

                let html = `<div class="cell-power" style="color: ${netColor};">${finalPowerText}</div>`;
                
                if (filteredForces.length > 0) {
                    filteredForces.forEach(f => {
                        const isEnemy = f.guild_id !== cellData.guild_id;
                        const isWinning = (f.resolvedPower === maxAttackerPower && maxAttackerPower !== 0 && isEnemy);

                        let attackerColor = getGuildColorByName(f.resolvedName);
                        let formattedForcePower = formatNumber(f.resolvedPower);

                        if (isWinning) {
                            html += `<div class="force-row winning-enemy"><span class="force-color-square" style="background-color: ${attackerColor};"></span><span class="force-power" style="color: ${attackerColor};"><b>${formattedForcePower}</b></span></div>`;
                        } else {
                            html += `<div class="force-row"><span class="force-color-square" style="background-color: ${attackerColor};"></span><span class="force-power" style="color: ${attackerColor};">${formattedForcePower}</span></div>`;
                        }
                    });
                }
                cellDiv.innerHTML = html;
            } else {
                cellDiv.innerHTML = `<div class="cell-power">???</div>`;
                cellDiv.style.backgroundColor = '#2f3136';
            }

            gridLayout.appendChild(cellDiv);
        }

        const rightStack = document.createElement('div');
        rightStack.className = 'side-stack';
        getRightGuilds(row.letter).forEach(g => {
            const tag = document.createElement('div');
            tag.className = 'guild-tag-box-v';
            tag.style.backgroundColor = getGuildColor(g.position);
            tag.title = g.name;
            rightStack.appendChild(tag);
        });
        gridLayout.appendChild(rightStack);
    });

    // --- 3. BOTTOM PERIMETER ---
    gridLayout.appendChild(document.createElement('div'));
    for (let x = 0; x < dimX; x++) {
        const bottomStack = document.createElement('div');
        bottomStack.className = 'perimeter-stack';
        getBottomGuilds(x + 1).forEach(g => {
            const tag = document.createElement('div');
            tag.className = 'guild-tag-box-h';
            tag.style.backgroundColor = getGuildColor(g.position);
            tag.title = g.name;
            bottomStack.appendChild(tag);
        });
        gridLayout.appendChild(bottomStack);
    }
    gridLayout.appendChild(document.createElement('div'));
}

function downloadPage() {
    const htmlContent = document.documentElement.outerHTML;
    const blob = new Blob([htmlContent], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'guild_war_template_map.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
