name: Download Mighty Party Configs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  fetch-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Msgpack
        run: npm install @msgpack/msgpack

      - name: Download & Decode All
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const msgpack = require("@msgpack/msgpack");

          // Add your full endpoint dictionary here
          const endpoints = {
              "ABTestsServer": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/ABTestsServer",
              "CheatersConstants": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/CheatersConstants"
              // ... add remaining endpoints
          };

          async function run() {
              const dir = "./decoded_configs";
              if (!fs.existsSync(dir)) fs.mkdirSync(dir);

              for (const [name, url] of Object.entries(endpoints)) {
                  try {
                      const res = await fetch(`https://mighty-party.com${url}`);
                      if (!res.ok) continue;
                      const buf = await res.arrayBuffer();
                      const json = msgpack.decode(new Uint8Array(buf));
                      fs.writeFileSync(path.join(dir, `${name}.json`), JSON.stringify(json, null, 2));
                      console.log(`Saved: ${name}.json`);
                  } catch (e) {
                      console.error(`Error on ${name}:`, e.message);
                  }
              }
          }
          run();
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add decoded_configs/
          git commit -m "Auto-update game config JSONs" || exit 0
          git push
