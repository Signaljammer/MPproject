              "Tutorials_towers_no_creative_Tutor_New_Path": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/Tutorials_towers_no_creative_Tutor_New_Path",
              "Tutorials_towers_roadmap_no_intro_Tutor_New_Path": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/Tutorials_towers_roadmap_no_intro_Tutor_New_Path",
              "UniqueUnlocks": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/UniqueUnlocks",
              "UsualEventRewards": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/UsualEventRewards",
              "UsualEventTiers": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/UsualEventTiers",
              "VIPLevels": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/VIPLevels",
              "ValueModulation": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/ValueModulation",
              "WakeupNotificationRewards": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/WakeupNotificationRewards",
              "WarlordSkins": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/WarlordSkins",
              "Warlords": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/Warlords",
              "boost": "/cc_api/configs_msgpack/f53437e7302104601d6b8bf1c58f6bef/boost"
          };

          async function run() {
              const dir = "./decoded_configs";
              if (!fs.existsSync(dir)) fs.mkdirSync(dir);

              for (const [name, url] of Object.entries(endpoints)) {
                  try {
                      const targetUrl = `https://mighty-party.com${url}`;
                      const proxyUrl = `https://corsproxy.io/?` + encodeURIComponent(targetUrl);
                      
                      const res = await fetch(proxyUrl);
                      if (!res.ok) {
                          console.warn(`Skipped ${name}: HTTP ${res.status}`);
                          continue;
                      }
                      const buf = await res.arrayBuffer();
                      const json = msgpack.decode(new Uint8Array(buf));
                      fs.writeFileSync(path.join(dir, `${name}.json`), JSON.stringify(json, null, 2));
                      console.log(`Saved: ${name}.json`);
                  } catch (e) {
                      console.error(`Error on ${name}:`, e.message);
                  }
              }
          }
          run();
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add decoded_configs/
          git commit -m "Auto-update game config JSONs" || exit 0
          git push
